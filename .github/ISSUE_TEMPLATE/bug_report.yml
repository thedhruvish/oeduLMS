name: 🐛 Bug Report
description: Report a bug or unintended behavior to help us improve VeoLMS.
title: "fix: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue!
        > [!CAUTION]
        > If you are reporting a **security vulnerability**, please DO NOT use this form. Send an email to **security@veolms.org**.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the issue you encountered in detail...
    validations:
      required: true

  - type: dropdown
    id: affected_component
    attributes:
      label: Affected Component
      description: Select which component is experiencing the issue.
      options:
        - "apps/web (Frontend)"
        - "apps/api (Backend API)"
        - "packages/database (Database / Migrations)"
        - "packages/contracts (API Contracts / Schemas)"
        - "packages/config (Configuration)"
        - "Documentation"
        - "Build / Tooling / Turborepo"
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: Detailed step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Run 'pnpm compose:up'
        2. Start the dev server 'pnpm dev'
        3. Navigate to 'http://localhost:3000/courses'
        4. See error...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: What should happen under normal operation?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: Provide version information about your local setup.
      value: |
        - OS: [e.g. Ubuntu 24.04, macOS 15, Windows 11]
        - Node version: [e.g. 24.10.0]
        - pnpm version: [e.g. 11.18.0]
        - Docker version: [e.g. 27.x]
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Error Output
      description: Paste any error messages, terminal output, or stack traces.
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: This is NOT a security vulnerability.
          required: true
